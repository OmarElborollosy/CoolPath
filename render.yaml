services:
  - type: web
    name: coolpath
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FORTYGUARD_API_KEY
        sync: false
      - key: FORTYGUARD_BASE_URL
        value: https://api.fortyguard.com
      - key: STUDY_DATE
        value: "2026-08-03"
      - key: LOG_LEVEL
        value: INFO
